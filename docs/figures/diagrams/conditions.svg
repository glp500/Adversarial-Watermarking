<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2330"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c85200"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a6374"/></marker><pattern id="h-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e2eff8"/><rect width="3.2" height="9" fill="#0072B2" opacity="0.55"/></pattern><pattern id="h-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbe8dc"/><rect width="3.2" height="9" fill="#c85200" opacity="0.55"/></pattern></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="50" font-size="24" fill="#1d2330" font-weight="700" text-anchor="start">The four conditions</text><text x="40" y="80" font-size="15" fill="#5a6374" font-weight="400" text-anchor="start">Two yes-or-no questions about what the receiving model gets.</text><text x="480.0" y="150" font-size="16" fill="#1d2330" font-weight="700" text-anchor="middle">Receiver not told</text><text x="870.0" y="150" font-size="16" fill="#1d2330" font-weight="700" text-anchor="middle">Receiver told the detector&#x27;s verdict</text><text x="300" y="230" font-size="16" fill="#0072B2" font-weight="700" text-anchor="end">Plain document</text><text x="300" y="252" font-size="13.5" fill="#5a6374" font-weight="400" text-anchor="end">SynthID off</text><text x="300" y="440" font-size="16" fill="#c85200" font-weight="700" text-anchor="end">Watermarked document</text><text x="300" y="462" font-size="13.5" fill="#5a6374" font-weight="400" text-anchor="end">SynthID on</text><rect x="330" y="170" width="300" height="130" rx="10" fill="#e2eff8" stroke="#0072B2" stroke-width="2" /><text x="374" y="220" font-size="30" fill="#0072B2" font-weight="700" text-anchor="start">C0</text><text x="374" y="252" font-size="14.5" fill="#1d2330" font-weight="700" text-anchor="start">baseline</text><text x="374" y="276" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">ordinary prompt</text><rect x="720" y="170" width="300" height="130" rx="10" fill="#e2eff8" stroke="#0072B2" stroke-width="2" /><rect x="721" y="171" width="22" height="128" rx="9" fill="url(#h-blue)" stroke="none" stroke-width="0" /><text x="764" y="220" font-size="30" fill="#0072B2" font-weight="700" text-anchor="start">C2</text><text x="764" y="252" font-size="14.5" fill="#1d2330" font-weight="700" text-anchor="start">told “no watermark detected”</text><text x="764" y="276" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">no extra instruction</text><rect x="330" y="380" width="300" height="130" rx="10" fill="#fbe8dc" stroke="#c85200" stroke-width="2" /><text x="374" y="430" font-size="30" fill="#c85200" font-weight="700" text-anchor="start">C1</text><text x="374" y="462" font-size="14.5" fill="#1d2330" font-weight="700" text-anchor="start">watermark, no hint</text><text x="374" y="486" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">ordinary prompt</text><rect x="720" y="380" width="300" height="130" rx="10" fill="#fbe8dc" stroke="#c85200" stroke-width="2" /><rect x="721" y="381" width="22" height="128" rx="9" fill="url(#h-orange)" stroke="none" stroke-width="0" /><text x="764" y="430" font-size="30" fill="#c85200" font-weight="700" text-anchor="start">C3</text><text x="764" y="462" font-size="14.5" fill="#1d2330" font-weight="700" text-anchor="start">told “watermark detected”</text><text x="764" y="486" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">+ harmless marker instruction</text><path d="M480.0,306 L480.0,374" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><text x="492.0" y="345.0" font-size="13.5" fill="#1d2330" font-weight="700" text-anchor="start">C1 − C0  watermark effect</text><path d="M870.0,306 L870.0,374" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><text x="882.0" y="345.0" font-size="13.5" fill="#1d2330" font-weight="700" text-anchor="start">C3 − C2  watermark effect, told</text><path d="M636,235.0 L714,235.0" fill="none" stroke="#5a6374" stroke-width="2" marker-end="url(#a-muted)"/><text x="675.0" y="225.0" font-size="13" fill="#5a6374" font-weight="700" text-anchor="middle">C2 − C0</text><text x="675.0" y="259.0" font-size="13" fill="#5a6374" font-weight="400" text-anchor="middle">telling</text><path d="M636,445.0 L714,445.0" fill="none" stroke="#5a6374" stroke-width="2" marker-end="url(#a-muted)"/><text x="675.0" y="435.0" font-size="13" fill="#5a6374" font-weight="700" text-anchor="middle">C3 − C1</text><text x="675.0" y="469.0" font-size="13" fill="#5a6374" font-weight="400" text-anchor="middle">telling</text><text x="40" y="568" font-size="13.5" fill="#5a6374" font-weight="400" text-anchor="start">Hatching marks the conditions where the verdict is added to the system prompt. The marker instruction is “start your answer with [WM-EVAL]”.</text></svg>