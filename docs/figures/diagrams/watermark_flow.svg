<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="470" viewBox="0 0 1320 470" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2330"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c85200"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a6374"/></marker><pattern id="h-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e2eff8"/><rect width="3.2" height="9" fill="#0072B2" opacity="0.55"/></pattern><pattern id="h-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbe8dc"/><rect width="3.2" height="9" fill="#c85200" opacity="0.55"/></pattern></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="50" font-size="24" fill="#1d2330" font-weight="700" text-anchor="start">Where the watermark enters</text><text x="40" y="80" font-size="15" fill="#5a6374" font-weight="400" text-anchor="start">The source is never changed. A model rewrites it, and SynthID tilts the rewrite&#x27;s word choices.</text><rect x="40" y="210" width="190" height="120" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="135" y="252" font-size="17" fill="#1d2330" font-weight="700" text-anchor="middle">Source article</text><text x="135" y="278.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">PDF or plain text</text><text x="135" y="298.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">stays unchanged</text><path d="M230,270 L288,270" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="290" y="210" width="230" height="120" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="405" y="252" font-size="17" fill="#1d2330" font-weight="700" text-anchor="middle">Generator LLM</text><text x="405" y="278.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">rewrites the article twice,</text><text x="405" y="298.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">same prompt and seed</text><path d="M520,270 L560,270 L560,185 L628,185" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#a-blue)"/><path d="M520,270 L560,270 L560,355 L628,355" fill="none" stroke="#c85200" stroke-width="2" marker-end="url(#a-orange)"/><rect x="630" y="111" width="92.6" height="24" rx="12" fill="#0072B2" stroke="#0072B2" stroke-width="1.5" /><text x="676.3" y="127.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">SynthID off</text><rect x="630" y="281" width="183.79999999999998" height="24" rx="12" fill="#c85200" stroke="#c85200" stroke-width="1.5" /><text x="721.9" y="297.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">SynthID on + secret key</text><rect x="630" y="143" width="220" height="84" rx="10" fill="#e2eff8" stroke="#0072B2" stroke-width="2" /><text x="740" y="179" font-size="17" fill="#1d2330" font-weight="700" text-anchor="middle">Plain rewrite</text><text x="740" y="205" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">the control</text><rect x="630" y="313" width="220" height="84" rx="10" fill="#fbe8dc" stroke="#c85200" stroke-width="2" /><text x="740" y="349" font-size="17" fill="#1d2330" font-weight="700" text-anchor="middle">Watermarked rewrite</text><text x="740" y="375" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">reads just as normally</text><path d="M850,185 L890,185 L890,250 L928,250" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#a-blue)"/><path d="M850,355 L890,355 L890,290 L928,290" fill="none" stroke="#c85200" stroke-width="2" marker-end="url(#a-orange)"/><rect x="930" y="210" width="170" height="120" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="1015" y="252" font-size="17" fill="#1d2330" font-weight="700" text-anchor="middle">Detector</text><text x="1015" y="278.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">same secret key,</text><text x="1015" y="298.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">statistical test</text><path d="M1100,250 L1140,250 L1140,185 L1158,185" fill="none" stroke="#0072B2" stroke-width="2" marker-end="url(#a-blue)"/><path d="M1100,290 L1140,290 L1140,355 L1158,355" fill="none" stroke="#c85200" stroke-width="2" marker-end="url(#a-orange)"/><rect x="1160" y="147" width="130" height="76" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2" /><text x="1225" y="179" font-size="15" fill="#0072B2" font-weight="700" text-anchor="middle">not detected</text><text x="1225" y="203" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">p = 0.62</text><rect x="1160" y="317" width="130" height="76" rx="10" fill="#ffffff" stroke="#c85200" stroke-width="2" /><text x="1225" y="349" font-size="15" fill="#c85200" font-weight="700" text-anchor="middle">detected</text><text x="1225" y="373" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">p = 1.9 × 10⁻¹⁷</text><text x="40" y="445" font-size="13.5" fill="#5a6374" font-weight="400" text-anchor="start">Example: Qwen3.5-2B, one fictional article, same seed for both rewrites. Detection counts as positive when p &lt; 0.01.</text></svg>