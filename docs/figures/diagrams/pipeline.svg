<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1200" viewBox="0 0 1120 1200" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2330"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c85200"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a6374"/></marker><pattern id="h-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e2eff8"/><rect width="3.2" height="9" fill="#0072B2" opacity="0.55"/></pattern><pattern id="h-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbe8dc"/><rect width="3.2" height="9" fill="#c85200" opacity="0.55"/></pattern></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="50" font-size="24" fill="#1d2330" font-weight="700" text-anchor="start">How one run flows</text><text x="40" y="80" font-size="15" fill="#5a6374" font-weight="400" text-anchor="start">Seven steps. Tags show the milestone from the original plan.</text><rect x="60" y="120" width="800" height="90" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="165" r="21" fill="#1d2330"/><text x="104" y="172" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="144" y="160" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Ingest sources</text><text x="144" y="186" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">PDF or text files become data/raw/*.jsonl</text><rect x="728.6" y="136" width="115.39999999999999" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="786.3000000000001" y="152.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">wm-eval ingest</text><path d="M460.0,210 L460.0,252" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="60" y="254" width="800" height="90" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="299" r="21" fill="#1d2330"/><text x="104" y="306" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="144" y="294" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Generate a matched pair</text><text x="144" y="320" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">same prompt and seed, SynthID off and on</text><rect x="819.8" y="270" width="24.2" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="831.9" y="286.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">M1</text><path d="M460.0,344 L460.0,386" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="60" y="388" width="800" height="90" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="433" r="21" fill="#1d2330"/><text x="104" y="440" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="144" y="428" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Detect the watermark</text><text x="144" y="454" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">secret key gives a p-value for each document</text><rect x="819.8" y="404" width="24.2" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="831.9" y="420.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">M2</text><path d="M460.0,478 L460.0,520" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="60" y="522" width="800" height="180" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="567" r="21" fill="#1d2330"/><text x="104" y="574" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="144" y="562" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Assign the four conditions</text><rect x="781.8" y="538" width="62.199999999999996" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="812.9" y="554.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">M5 · M7</text><text x="144" y="592.0" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">every document pair goes to all four</text><text x="144" y="613.025" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">C2 and C3 add the detector&#x27;s verdict</text><text x="144" y="634.05" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">to the receiver&#x27;s system prompt</text><rect x="450" y="578" width="170" height="52" rx="7" fill="#e2eff8" stroke="#0072B2" stroke-width="1.8" /><text x="474" y="600" font-size="15" fill="#0072B2" font-weight="700" text-anchor="start">C0</text><text x="474" y="619" font-size="12.5" fill="#1d2330" font-weight="400" text-anchor="start">plain · not told</text><rect x="634" y="578" width="170" height="52" rx="7" fill="#e2eff8" stroke="#0072B2" stroke-width="1.8" /><rect x="635" y="579" width="14" height="50" rx="6" fill="url(#h-blue)" stroke="none" stroke-width="0" /><text x="658" y="600" font-size="15" fill="#0072B2" font-weight="700" text-anchor="start">C2</text><text x="658" y="619" font-size="12.5" fill="#1d2330" font-weight="400" text-anchor="start">plain · told</text><rect x="450" y="640" width="170" height="52" rx="7" fill="#fbe8dc" stroke="#c85200" stroke-width="1.8" /><text x="474" y="662" font-size="15" fill="#c85200" font-weight="700" text-anchor="start">C1</text><text x="474" y="681" font-size="12.5" fill="#1d2330" font-weight="400" text-anchor="start">watermarked · not told</text><rect x="634" y="640" width="170" height="52" rx="7" fill="#fbe8dc" stroke="#c85200" stroke-width="1.8" /><rect x="635" y="641" width="14" height="50" rx="6" fill="url(#h-orange)" stroke="none" stroke-width="0" /><text x="658" y="662" font-size="15" fill="#c85200" font-weight="700" text-anchor="start">C3</text><text x="658" y="681" font-size="12.5" fill="#1d2330" font-weight="400" text-anchor="start">watermarked · told</text><path d="M460.0,702 L460.0,744" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="60" y="746" width="800" height="90" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="791" r="21" fill="#1d2330"/><text x="104" y="798" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="144" y="786" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Receiver does a task</text><text x="144" y="812" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">llama-server model or sandboxed file agent</text><rect x="781.8" y="762" width="62.199999999999996" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="812.9" y="778.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">M3 · M8</text><path d="M460.0,836 L460.0,878" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="60" y="880" width="800" height="90" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="925" r="21" fill="#1d2330"/><text x="104" y="932" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="144" y="920" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Score the response</text><text x="144" y="946" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">sentiment, emotion, contradiction, similarity, length, success</text><rect x="819.8" y="896" width="24.2" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="831.9" y="912.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">M4</text><path d="M460.0,970 L460.0,1012" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><rect x="60" y="1014" width="800" height="90" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><circle cx="104" cy="1059" r="21" fill="#1d2330"/><text x="104" y="1066" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">7</text><text x="144" y="1054" font-size="18" fill="#1d2330" font-weight="700" text-anchor="start">Compare and report</text><text x="144" y="1080" font-size="14.5" fill="#5a6374" font-weight="400" text-anchor="start">paired differences, bootstrap over source articles, figures</text><rect x="819.8" y="1030" width="24.2" height="24" rx="12" fill="#1d2330" stroke="#1d2330" stroke-width="1.5" /><text x="831.9" y="1046.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">M6</text><rect x="930" y="120" width="160" height="984" rx="10" fill="#f3f5f8" stroke="#5a6374" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1010" y="160" font-size="16" fill="#1d2330" font-weight="700" text-anchor="middle">results/</text><text x="1010" y="182" font-size="16" fill="#1d2330" font-weight="700" text-anchor="middle">RUN_ID/</text><text x="1010" y="230.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">every step saves</text><text x="1010" y="250.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">its inputs and</text><text x="1010" y="270.6" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">outputs here,</text><text x="1010" y="290.9" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">write-once</text><text x="1010" y="370.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">plus a log of</text><text x="1010" y="390.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">every event</text><text x="1010" y="1024.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">--resume</text><text x="1010" y="1044.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">redoes only</text><text x="1010" y="1064.6" font-size="14" fill="#5a6374" font-weight="400" text-anchor="middle">missing work</text><line x1="860" y1="165.0" x2="930" y2="165.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="860" y1="299.0" x2="930" y2="299.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="860" y1="433.0" x2="930" y2="433.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="860" y1="612.0" x2="930" y2="612.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="860" y1="791.0" x2="930" y2="791.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="860" y1="925.0" x2="930" y2="925.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><line x1="860" y1="1059.0" x2="930" y2="1059.0" stroke="#a3abb8" stroke-width="1.5" stroke-dasharray="3 5"/><text x="60" y="1158" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">On a 6 GB GPU, steps 2 and 3 run first. Then llama-server starts and the run resumes at step 5.</text></svg>