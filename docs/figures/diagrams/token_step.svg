<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1d2330"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0072B2"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c85200"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5a6374"/></marker><pattern id="h-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e2eff8"/><rect width="3.2" height="9" fill="#0072B2" opacity="0.55"/></pattern><pattern id="h-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#fbe8dc"/><rect width="3.2" height="9" fill="#c85200" opacity="0.55"/></pattern></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="50" font-size="24" fill="#1d2330" font-weight="700" text-anchor="start">How SynthID picks each word: a tournament</text><text x="40" y="80" font-size="15" fill="#5a6374" font-weight="400" text-anchor="start">Simplified to 3 rounds and 8 draws. The real watermark uses 30 rounds, computed exactly.</text><rect x="40" y="150" width="250" height="250" rx="10" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="165" y="180" font-size="16" fill="#1d2330" font-weight="700" text-anchor="middle">Text so far</text><text x="165" y="210" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="middle" font-style="italic">“…the moss spread ___”</text><text x="60" y="250" font-size="13" fill="#5a6374" font-weight="700" text-anchor="start">model&#x27;s odds</text><text x="60" y="276" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><text x="270" y="276" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="end">30%</text><text x="60" y="302" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="start">quickly</text><text x="270" y="302" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="end">28%</text><text x="60" y="328" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="start">soon</text><text x="270" y="328" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="end">12%</text><text x="60" y="354" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="start">other words</text><text x="270" y="354" font-size="14.5" fill="#1d2330" font-weight="400" text-anchor="end">30%</text><path d="M290,275 L338,275" fill="none" stroke="#1d2330" stroke-width="2" marker-end="url(#a-ink)"/><text x="340" y="128" font-size="13.5" fill="#5a6374" font-weight="700" text-anchor="start">8 draws from the model</text><text x="580" y="128" font-size="13.5" fill="#5a6374" font-weight="700" text-anchor="start">round 1: higher g₁ wins</text><text x="820" y="128" font-size="13.5" fill="#5a6374" font-weight="700" text-anchor="start">round 2: higher g₂ wins</text><text x="1060" y="128" font-size="13.5" fill="#5a6374" font-weight="700" text-anchor="start">round 3: higher g₃ wins</text><rect x="340" y="142.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="165" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><rect x="456" y="154" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="472" y="154" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="154" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="192.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="215" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">quickly</text><rect x="456" y="204" width="12" height="12" rx="2" fill="#c85200" stroke="#1d2330" stroke-width="2" /><rect x="472" y="204" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="204" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="242.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="265" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><rect x="456" y="254" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="472" y="254" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="254" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="292.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="315" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">slowly</text><rect x="456" y="304" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="472" y="304" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="304" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="342.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="365" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">soon</text><rect x="456" y="354" width="12" height="12" rx="2" fill="#c85200" stroke="#1d2330" stroke-width="2" /><rect x="472" y="354" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="354" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="392.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="415" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><rect x="456" y="404" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="472" y="404" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="404" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="442.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="465" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">quickly</text><rect x="456" y="454" width="12" height="12" rx="2" fill="#c85200" stroke="#1d2330" stroke-width="2" /><rect x="472" y="454" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="454" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="340" y="492.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="352" y="515" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><rect x="456" y="504" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="472" y="504" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="488" y="504" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><path d="M510,160 H545.0 V210 M510,210 H545.0 M545.0,185.0 H578" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="580" y="167.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="592" y="190.0" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">quickly</text><rect x="696" y="179.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="712" y="179.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="728" y="179.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><path d="M510,260 H545.0 V310 M510,310 H545.0 M545.0,285.0 H578" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="580" y="267.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="592" y="290.0" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><rect x="696" y="279.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="712" y="279.0" width="12" height="12" rx="2" fill="#c85200" stroke="#1d2330" stroke-width="2" /><rect x="728" y="279.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><path d="M510,360 H545.0 V410 M510,410 H545.0 M545.0,385.0 H578" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="580" y="367.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="592" y="390.0" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">soon</text><rect x="696" y="379.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="712" y="379.0" width="12" height="12" rx="2" fill="#c85200" stroke="#1d2330" stroke-width="2" /><rect x="728" y="379.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><path d="M510,460 H545.0 V510 M510,510 H545.0 M545.0,485.0 H578" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="580" y="467.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="592" y="490.0" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">quickly</text><rect x="696" y="479.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="712" y="479.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><rect x="728" y="479.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><text x="758" y="307.0" font-size="12" fill="#5a6374" font-weight="400" text-anchor="start">tie → coin flip</text><path d="M750,185.0 H785.0 V285.0 M750,285.0 H785.0 M785.0,235.0 H818" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="820" y="217.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="832" y="240.0" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">rapidly</text><rect x="936" y="229.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="952" y="229.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="968" y="229.0" width="12" height="12" rx="2" fill="#c85200" stroke="#1d2330" stroke-width="2" /><path d="M750,385.0 H785.0 V485.0 M750,485.0 H785.0 M785.0,435.0 H818" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="820" y="417.0" width="170" height="36" rx="7" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5" /><text x="832" y="440.0" font-size="15" fill="#1d2330" font-weight="400" text-anchor="start">soon</text><rect x="936" y="429.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="952" y="429.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="968" y="429.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#1d2330" stroke-width="2" /><path d="M990,235.0 H1025.0 V435.0 M990,435.0 H1025.0 M1025.0,335.0 H1058" fill="none" stroke="#a3abb8" stroke-width="1.5"/><rect x="1060" y="317.0" width="170" height="36" rx="7" fill="#fbe8dc" stroke="#c85200" stroke-width="2" /><text x="1072" y="340.0" font-size="15" fill="#1d2330" font-weight="700" text-anchor="start">rapidly</text><rect x="1176" y="329.0" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><rect x="1192" y="329.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><rect x="1208" y="329.0" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><text x="1060" y="379.0" font-size="14" fill="#c85200" font-weight="700" text-anchor="start">written next</text><rect x="1060" y="520" width="12" height="12" rx="2" fill="#c85200" stroke="#a3abb8" stroke-width="1" /><text x="1080" y="531" font-size="13" fill="#5a6374" font-weight="400" text-anchor="start">bit = 1</text><rect x="1150" y="520" width="12" height="12" rx="2" fill="#ffffff" stroke="#a3abb8" stroke-width="1" /><text x="1170" y="531" font-size="13" fill="#5a6374" font-weight="400" text-anchor="start">bit = 0</text><text x="1060" y="556" font-size="13" fill="#5a6374" font-weight="400" text-anchor="start">squares: g₁ g₂ g₃</text><text x="1060" y="578" font-size="13" fill="#5a6374" font-weight="400" text-anchor="start">outlined: the bit</text><text x="1060" y="596" font-size="13" fill="#5a6374" font-weight="400" text-anchor="start">that decides the round</text><line x1="40" y1="620" x2="1360" y2="620" stroke="#c3cad6" stroke-width="1.5"/><text x="40" y="656" font-size="16" fill="#1d2330" font-weight="700" text-anchor="start">Where the bits come from</text><text x="40" y="684.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">secret key + previous 4 words + candidate word + round</text><text x="40" y="704.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">→ hashed into a fixed random table of 0s and 1s.</text><text x="40" y="724.6" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">Same inputs, same bit, every time. Without the key,</text><text x="40" y="744.9" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">the bits look like coin flips.</text><text x="520" y="656" font-size="16" fill="#1d2330" font-weight="700" text-anchor="start">What the detector checks</text><text x="520" y="684.0" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">Recompute the 30 bits of every written word.</text><text x="520" y="704.3" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">Normal text: about half are 1.</text><text x="520" y="724.6" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">Watermarked example: 3,876 of 7,050 are 1 (0.550),</text><text x="520" y="744.9" font-size="14" fill="#5a6374" font-weight="400" text-anchor="start">p = 1.9 × 10⁻¹⁷.</text><text x="960" y="656" font-size="16" fill="#1d2330" font-weight="700" text-anchor="start">Signal per word depends on choice</text><text x="960" y="678" font-size="12.5" fill="#5a6374" font-weight="400" text-anchor="start">expected share of 1-bits in the picked word, 30 rounds</text><text x="960" y="719" font-size="14" fill="#1d2330" font-weight="400" text-anchor="start">95% on one word</text><line x1="1130" y1="702" x2="1130" y2="726" stroke="#5a6374" stroke-width="1.5"/><rect x="1130" y="706" width="21.60000000000002" height="16" rx="2" fill="#c85200" stroke="#c85200" stroke-width="0" /><text x="1159.6" y="719" font-size="13.5" fill="#1d2330" font-weight="700" text-anchor="start">0.518</text><text x="960" y="753" font-size="14" fill="#1d2330" font-weight="400" text-anchor="start">the moss example</text><line x1="1130" y1="736" x2="1130" y2="760" stroke="#5a6374" stroke-width="1.5"/><rect x="1130" y="740" width="144.0" height="16" rx="2" fill="#c85200" stroke="#c85200" stroke-width="0" /><text x="1282.0" y="753" font-size="13.5" fill="#1d2330" font-weight="700" text-anchor="start">0.620</text><text x="960" y="787" font-size="14" fill="#1d2330" font-weight="400" text-anchor="start">40 equally likely</text><line x1="1130" y1="770" x2="1130" y2="794" stroke="#5a6374" stroke-width="1.5"/><rect x="1130" y="774" width="213.60000000000005" height="16" rx="2" fill="#c85200" stroke="#c85200" stroke-width="0" /><text x="1351.6000000000001" y="787" font-size="13.5" fill="#1d2330" font-weight="700" text-anchor="start">0.678</text><text x="1130" y="812" font-size="12.5" fill="#5a6374" font-weight="400" text-anchor="middle">0.5 = no signal</text><text x="40" y="856" font-size="13.5" fill="#5a6374" font-weight="400" text-anchor="start">Every draw comes from the model, so the winner is always a word the model might have written. Averaged over keys, each word keeps its original odds.</text></svg>